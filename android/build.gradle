// android/build.gradle
// Plugin versions live in settings.gradle; google-services is applied in app/.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

// Several plugins still compile against SDK 33, which their AndroidX
// dependencies reject; build every plugin against the app's SDK instead.
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library")) {
            project.android.compileSdk = 36
        }
    }
}
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

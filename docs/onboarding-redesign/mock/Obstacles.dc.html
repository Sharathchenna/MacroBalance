<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiz: obstacles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0E0D}
a{color:#57D883}a:hover{color:#8BE8AA}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}
.pill{display:flex;align-items:center;gap:8px;min-height:48px;box-sizing:border-box;padding:0 16px;border-radius:24px;cursor:pointer;font:500 15px Inter,sans-serif;transition:background .2s,border-color .2s,color .2s,transform .15s}
.pill:active{transform:scale(.96)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 18px 24px 34px; display: flex; flex-direction: column; background: #0C0E0D; color: #F4F6F4; font-family: Inter, sans-serif; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 14px; height: 44px">
    <a href="Pace.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #151917; display: flex; align-items: center; justify-content: center; color: #F4F6F4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex-grow: 1; display: flex; gap: 6px" aria-label="Step 7 of 10">
      <div style="flex: 3; height: 6px; border-radius: 3px; background: #57D883"></div>
      <div style="flex: 3; height: 6px; border-radius: 3px; background: #2A302C; overflow: hidden"><div style="width: 90%; height: 6px; background: #57D883; border-radius: 3px"></div></div>
      <div style="flex: 2; height: 6px; border-radius: 3px; background: #2A302C"></div>
      <div style="flex: 1; height: 6px; border-radius: 3px; background: #2A302C"></div>
    </div>
  </div>

  <p class="rise" style="margin: 30px 0 0; font: 600 12px Inter, sans-serif; letter-spacing: 1.6px; color: #57D883">BE HONEST</p>
  <h1 class="rise d1" style="margin: 10px 0 0; font: 600 32px/1.12 Onest, sans-serif; letter-spacing: -1px">What’s gotten in the way before?</h1>
  <p class="rise d1" style="margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: #A3ADA6">Pick any that sound familiar. We’ll shape your plan around them.</p>

  <div class="rise d2" style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="7">
      <button class="pill" onClick="{{it.toggle}}" aria-pressed="{{it.on}}" style="background: {{it.bg}}; border: 1.5px solid {{it.border}}; color: {{it.fg}}">
        <sc-if value="{{it.on}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#57D883" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
        {{it.label}}
      </button>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>
  <p style="margin: 0 0 12px; text-align: center; font-size: 13px; color: #7C8680">{{count}} selected</p>
  <a href="Insight.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: #57D883; color: #06240F; font: 600 17px Onest, sans-serif; text-decoration: none">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = [
      'Logging took too long',
      'My target never changed',
      'I didn’t trust the numbers',
      'Weekends undo my week',
      'I hit a plateau',
      'Eating out is hard',
      'I lost motivation',
    ];
    const on = (this.state && this.state.on) || { 0: true, 1: true };
    const items = labels.map((label, i) => ({
      label,
      on: !!on[i],
      bg: on[i] ? 'rgba(87,216,131,.1)' : '#151917',
      border: on[i] ? '#57D883' : '#2A302C',
      fg: on[i] ? '#F4F6F4' : '#C9D0CB',
      toggle: () => this.setState({ on: { ...on, [i]: !on[i] } }),
    }));
    return { items, count: items.filter((x) => x.on).length };
  }
}
</script>
</body>
</html>

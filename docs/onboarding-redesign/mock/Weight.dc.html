<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiz: current weight</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0E0D}
a{color:#57D883}a:hover{color:#8BE8AA}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
.unit{height:36px;padding:0 18px;border-radius:18px;border:0;font:600 14px Inter,sans-serif;cursor:pointer}
.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;cursor:grab}
.strip::-webkit-scrollbar{display:none}
.snap{scroll-snap-align:center;flex-shrink:0}
.num{width:190px;padding:0;border:0;background:transparent;color:#F4F6F4;text-align:right;font:600 76px/1 Onest,sans-serif;letter-spacing:-3px;outline:none;-moz-appearance:textfield}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num:focus{color:#57D883}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 18px 24px 34px; display: flex; flex-direction: column; background: #0C0E0D; color: #F4F6F4; font-family: Inter, sans-serif; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 14px; height: 44px">
    <a href="AboutYou.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #151917; display: flex; align-items: center; justify-content: center; color: #F4F6F4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex-grow: 1; display: flex; gap: 6px" aria-label="Step 3 of 10">
      <div style="flex: 3; height: 6px; border-radius: 3px; background: #2A302C; overflow: hidden"><div style="width: 75%; height: 6px; background: #57D883; border-radius: 3px"></div></div>
      <div style="flex: 3; height: 6px; border-radius: 3px; background: #2A302C"></div>
      <div style="flex: 2; height: 6px; border-radius: 3px; background: #2A302C"></div>
      <div style="flex: 1; height: 6px; border-radius: 3px; background: #2A302C"></div>
    </div>
  </div>

  <p class="rise" style="margin: 30px 0 0; font: 600 12px Inter, sans-serif; letter-spacing: 1.6px; color: #57D883">ABOUT YOU</p>
  <h1 class="rise d1" style="margin: 10px 0 0; font: 600 32px/1.12 Onest, sans-serif; letter-spacing: -1px">What do you weigh today?</h1>

  <div class="rise d2" style="display: flex; justify-content: center; margin-top: 24px">
    <div style="display: flex; gap: 4px; padding: 4px; border-radius: 22px; background: #151917">
      <button class="unit" onClick="{{toKg}}" style="background: {{kgBg}}; color: {{kgFg}}">kg</button>
      <button class="unit" onClick="{{toLb}}" style="background: {{lbBg}}; color: {{lbFg}}">lb</button>
    </div>
  </div>

  <div class="rise d2" style="display: flex; align-items: baseline; justify-content: center; gap: 6px; margin-top: 26px">
    <label for="weightInput" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Weight in {{unit}}</label>
    <input id="weightInput" class="num" type="number" inputmode="decimal" step="0.1" value="{{text}}" onChange="{{type}}" onBlur="{{blur}}">
    <span style="width: 120px; font: 500 22px Onest, sans-serif; color: #A3ADA6">{{unit}}</span>
  </div>
  <p class="rise d2" style="margin: 8px 0 0; text-align: center; font-size: 12px; color: #7C8680">Swipe the ruler or tap the number to type</p>

  <div class="rise d3" style="position: relative; margin: 18px -24px 0">
    <div class="strip" ref="{{stripRef}}" onScroll="{{onScroll}}" style="padding: 0 192px" aria-hidden="true">
      <sc-for list="{{ticks}}" as="t" hint-placeholder-count="80">
        <div class="snap" style="width: 6px; height: 74px; display: flex; flex-direction: column; align-items: center">
          <div style="width: 2px; height: {{t.h}}px; border-radius: 1px; background: {{t.c}}"></div>
          <div style="margin-top: 8px; font: 500 12px Inter, sans-serif; color: #7C8680; white-space: nowrap; height: 16px">{{t.label}}</div>
        </div>
      </sc-for>
    </div>
    <div style="position: absolute; left: 193px; top: -6px; width: 4px; height: 54px; border-radius: 2px; background: #57D883; pointer-events: none"></div>
    <div style="position: absolute; left: 0; top: 0; width: 80px; height: 74px; background: linear-gradient(90deg,#0C0E0D,rgba(12,14,13,0)); pointer-events: none"></div>
    <div style="position: absolute; right: 0; top: 0; width: 80px; height: 74px; background: linear-gradient(270deg,#0C0E0D,rgba(12,14,13,0)); pointer-events: none"></div>
  </div>

  <div class="rise d3" style="display: flex; gap: 12px; margin-top: 30px; padding: 14px 16px; border-radius: 18px; background: #151917">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57D883" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px" aria-hidden="true"><path d="M3 17c3-1 4-6 7-6s3 4 6 4 4-5 5-6"></path></svg>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #A3ADA6">We follow your <span style="color: #F4F6F4">trend</span>, not daily swings. Water and salt can move you a kilo overnight, so today’s number is just a starting point.</p>
  </div>

  <div style="flex-grow: 1"></div>
  <a href="Activity.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: #57D883; color: #06240F; font: 600 17px Onest, sans-serif; text-decoration: none">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // One tick is 0.1 kg and 6px wide, so the value is the scroll offset / 6.
  // The ruler glides from 70 to today's weight once, to show it moves.
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const MIN = 40, MAX = 160, PX = 6;
    const s = this.state || {};
    const kg = s.kg != null ? s.kg : 82.4;
    const lb = s.unit === 'lb';
    if (!this.ticks) {
      this.ticks = [];
      for (let i = 0; i <= (MAX - MIN) * 10; i++) {
        const major = i % 50 === 0, whole = i % 10 === 0;
        this.ticks.push({ h: major ? 40 : whole ? 24 : 12, c: major ? '#A3ADA6' : whole ? '#4A524C' : '#2E3530', label: major ? String(MIN + i / 10) : '' });
      }
    }
    const toPx = (v) => Math.round((v - MIN) * 10) * PX;
    const set = (v, scroll) => {
      const k = Math.round(Math.min(MAX, Math.max(MIN, v)) * 10) / 10;
      if (k !== kg) this.setState({ kg: k });
      if (scroll && this.el) this.el.scrollTo({ left: toPx(k), behavior: 'smooth' });
    };
    return {
      ticks: this.ticks,
      unit: lb ? 'lb' : 'kg',
      text: s.draft != null ? s.draft : (lb ? kg * 2.20462 : kg).toFixed(1),
      type: (e) => {
        const raw = e.target.value.slice(0, 5);
        this.setState({ draft: raw });
        const v = parseFloat(raw);
        const asKg = lb ? v / 2.20462 : v;
        if (asKg >= MIN && asKg <= MAX) set(asKg, true);
      },
      blur: () => this.setState({ draft: null }),
      stripRef: (el) => {
        if (el && el !== this.el) {
          this.el = el;
          el.scrollLeft = toPx(70);
          this.t = setTimeout(() => el.scrollTo({ left: toPx(kg), behavior: 'smooth' }), 400);
        }
      },
      onScroll: (e) => { if (s.draft == null) set(MIN + Math.round(e.currentTarget.scrollLeft / PX) / 10, false); },
      kgBg: lb ? 'transparent' : '#F4F6F4', kgFg: lb ? '#A3ADA6' : '#0C0E0D',
      lbBg: lb ? '#F4F6F4' : 'transparent', lbFg: lb ? '#0C0E0D' : '#A3ADA6',
      toKg: () => this.setState({ unit: 'kg' }),
      toLb: () => this.setState({ unit: 'lb' }),
    };
  }
}
</script>
</body>
</html>

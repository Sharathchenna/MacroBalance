<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiz: goal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0E0D}
a{color:#57D883}a:hover{color:#8BE8AA}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;box-sizing:border-box;padding:16px;border-radius:22px;cursor:pointer;text-align:left;font-family:Inter,sans-serif;transition:background .25s,border-color .25s,transform .15s}
.opt:active{transform:scale(.98)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.ico{animation:bob 3s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 18px 24px 34px; display: flex; flex-direction: column; background: #0C0E0D; color: #F4F6F4; font-family: Inter, sans-serif; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 14px; height: 44px">
    <a href="StoryLearn.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #151917; display: flex; align-items: center; justify-content: center; color: #F4F6F4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex-grow: 1; display: flex; gap: 6px" aria-label="Step 1 of 10">
      <div style="flex: 3; height: 6px; border-radius: 3px; background: #2A302C; overflow: hidden"><div style="width: 22%; height: 6px; background: #57D883; border-radius: 3px"></div></div>
      <div style="flex: 3; height: 6px; border-radius: 3px; background: #2A302C"></div>
      <div style="flex: 2; height: 6px; border-radius: 3px; background: #2A302C"></div>
      <div style="flex: 1; height: 6px; border-radius: 3px; background: #2A302C"></div>
    </div>
  </div>

  <p class="rise" style="margin: 30px 0 0; font: 600 12px Inter, sans-serif; letter-spacing: 1.6px; color: #57D883">YOUR GOAL</p>
  <h1 class="rise d1" style="margin: 10px 0 0; font: 600 32px/1.12 Onest, sans-serif; letter-spacing: -1px">What do you want to change?</h1>
  <p class="rise d1" style="margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: #A3ADA6">This sets the direction of your plan. You can change it any time.</p>

  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 28px">
    <button class="opt rise d2" onClick="{{pickLose}}" style="background: {{lose.bg}}; border: 2px solid {{lose.border}}; color: #F4F6F4">
      <div class="ico" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 16px; background: #1D221F; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#57D883" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l6 6 4-4 8 8"></path><path d="M15 17h6v-6"></path></svg></div>
      <div style="flex-grow: 1"><div style="font: 600 17px Onest, sans-serif">Lose fat</div><div style="font-size: 14px; color: #A3ADA6; margin-top: 3px">Drop weight and keep your muscle</div></div>
      <div style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 12px; border: 2px solid {{lose.border}}; background: {{lose.dot}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#06240F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
    </button>
    <button class="opt rise d3" onClick="{{pickMaintain}}" style="background: {{maintain.bg}}; border: 2px solid {{maintain.border}}; color: #F4F6F4">
      <div class="ico" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 16px; background: #1D221F; display: flex; align-items: center; justify-content: center; animation-delay: .4s"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4DA8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M5 8h14M5 8l-2.5 6a3 3 0 0 0 5 0zM19 8l-2.5 6a3 3 0 0 0 5 0z"></path></svg></div>
      <div style="flex-grow: 1"><div style="font: 600 17px Onest, sans-serif">Maintain</div><div style="font-size: 14px; color: #A3ADA6; margin-top: 3px">Hold steady and eat with intent</div></div>
      <div style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 12px; border: 2px solid {{maintain.border}}; background: {{maintain.dot}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#06240F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
    </button>
    <button class="opt rise d4" onClick="{{pickGain}}" style="background: {{gain.bg}}; border: 2px solid {{gain.border}}; color: #F4F6F4">
      <div class="ico" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 16px; background: #1D221F; display: flex; align-items: center; justify-content: center; animation-delay: .8s"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F59E3B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg></div>
      <div style="flex-grow: 1"><div style="font: 600 17px Onest, sans-serif">Build muscle</div><div style="font-size: 14px; color: #A3ADA6; margin-top: 3px">Gain lean weight, slowly and on purpose</div></div>
      <div style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 12px; border: 2px solid {{gain.border}}; background: {{gain.dot}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#06240F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
    </button>
  </div>

  <div style="flex-grow: 1"></div>
  <a href="AboutYou.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: #57D883; color: #06240F; font: 600 17px Onest, sans-serif; text-decoration: none">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const picked = (this.state && this.state.goal) || 'lose';
    const look = (id) => picked === id
      ? { bg: 'rgba(87,216,131,.08)', border: '#57D883', dot: '#57D883' }
      : { bg: '#151917', border: '#2A302C', dot: 'transparent' };
    return {
      lose: look('lose'), maintain: look('maintain'), gain: look('gain'),
      pickLose: () => this.setState({ goal: 'lose' }),
      pickMaintain: () => this.setState({ goal: 'maintain' }),
      pickGain: () => this.setState({ goal: 'gain' }),
    };
  }
}
</script>
</body>
</html>

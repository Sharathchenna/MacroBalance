<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How did you hear about us</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0E0D}
a{color:#57D883}a:hover{color:#8BE8AA}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
.chip{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;box-sizing:border-box;padding:0 12px;border-radius:16px;cursor:pointer;font:600 15px Onest,sans-serif;color:#F4F6F4;transition:background .2s,border-color .2s}
.other{width:100%;box-sizing:border-box;height:52px;padding:0 16px;border-radius:16px;background:#151917;color:#F4F6F4;font:500 16px Inter,sans-serif;outline:none;transition:border-color .2s}
.other::placeholder{color:#7C8680}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 18px 24px 34px; display: flex; flex-direction: column; background: #0C0E0D; color: #F4F6F4; font-family: Inter, sans-serif; overflow: hidden">
  <div style="display: flex; justify-content: flex-end; height: 44px">
    <a href="Paywall.dc.html" style="display: flex; align-items: center; height: 44px; color: #A3ADA6; font: 500 15px Inter, sans-serif; text-decoration: none">Skip</a>
  </div>

  <h1 class="rise" style="margin: 18px 0 0; font: 600 32px/1.12 Onest, sans-serif; letter-spacing: -1px">One quick thing. How did you find us?</h1>
  <p class="rise" style="margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: #A3ADA6">It helps a small team know where to show up.</p>

  <p class="rise d1" style="margin: 24px 0 10px; font: 600 12px Inter, sans-serif; letter-spacing: 1.6px; color: #A3ADA6">SOCIAL MEDIA AND CONTENT</p>
  <div class="rise d1" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{social}}" as="o" hint-placeholder-count="4">
      <button class="chip" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="background: {{o.bg}}; border: 2px solid {{o.border}}">{{o.label}}</button>
    </sc-for>
  </div>

  <p class="rise d2" style="margin: 20px 0 10px; font: 600 12px Inter, sans-serif; letter-spacing: 1.6px; color: #A3ADA6">SOMEONE OR SOMEWHERE</p>
  <div class="rise d2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{people}}" as="o" hint-placeholder-count="4">
      <button class="chip" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="background: {{o.bg}}; border: 2px solid {{o.border}}">{{o.label}}</button>
    </sc-for>
  </div>

  <div class="rise d3" style="margin-top: 20px">
    <label for="otherSource" style="display: block; margin: 0 0 8px; font: 600 12px Inter, sans-serif; letter-spacing: 1.6px; color: #A3ADA6">SOMEWHERE ELSE?</label>
    <input id="otherSource" class="other" type="text" placeholder="Tell us where, e.g. a podcast" value="{{otherText}}" onFocus="{{focusOther}}" onChange="{{typeOther}}" style="border: 2px solid {{otherBorder}}">
  </div>

  <div style="flex-grow: 1"></div>
  <a href="Paywall.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: {{ctaBg}}; color: {{ctaFg}}; font: 600 17px Onest, sans-serif; text-decoration: none">{{cta}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Values keep today's PostHog keys (tiktok, instagram, reddit, "other: …")
  // and add new ones alongside, so old and new answers stay comparable.
  renderVals() {
    const s = this.state || {};
    const picked = s.src;
    const chip = ([id, label]) => ({
      label, on: picked === id,
      bg: picked === id ? 'rgba(87,216,131,.08)' : '#151917',
      border: picked === id ? '#57D883' : '#2A302C',
      pick: () => this.setState({ src: id }),
    });
    const otherOn = picked === 'other';
    return {
      social: [['tiktok', 'TikTok'], ['instagram', 'Instagram'], ['youtube', 'YouTube'], ['reddit', 'Reddit']].map(chip),
      people: [['ad', 'An ad'], ['friend', 'A friend'], ['club', 'Gym, club or coach'], ['app_store', 'App Store']].map(chip),
      otherText: s.other || '',
      otherBorder: otherOn ? '#57D883' : '#2A302C',
      focusOther: () => this.setState({ src: 'other' }),
      typeOther: (e) => this.setState({ src: 'other', other: e.target.value }),
      cta: picked ? 'Continue' : 'Skip',
      ctaBg: picked ? '#57D883' : '#1D221F',
      ctaFg: picked ? '#06240F' : '#F4F6F4',
    };
  }
}
</script>
</body>
</html>

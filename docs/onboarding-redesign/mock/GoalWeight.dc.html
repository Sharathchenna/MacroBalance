<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiz: goal weight</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0E0D}
a{color:#57D883}a:hover{color:#8BE8AA}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.proj{stroke-dasharray:1 1;animation:draw 1.6s .5s cubic-bezier(.4,0,.2,1) both}
@keyframes land{0%{opacity:0;transform:scale(0)}70%{transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
.flag{transform-box:fill-box;transform-origin:center;animation:land .5s 2s cubic-bezier(.2,.9,.3,1.3) both}
.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;cursor:grab}
.strip::-webkit-scrollbar{display:none}
.snap{scroll-snap-align:center;flex-shrink:0}
.num{width:170px;padding:0;border:0;background:transparent;color:#F4F6F4;text-align:right;font:600 64px/1 Onest,sans-serif;letter-spacing:-2.5px;outline:none;-moz-appearance:textfield}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num:focus{color:#57D883}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 18px 24px 34px; display: flex; flex-direction: column; background: #0C0E0D; color: #F4F6F4; font-family: Inter, sans-serif; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 14px; height: 44px">
    <a href="Activity.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #151917; display: flex; align-items: center; justify-content: center; color: #F4F6F4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex-grow: 1; display: flex; gap: 6px" aria-label="Step 5 of 10">
      <div style="flex: 3; height: 6px; border-radius: 3px; background: #57D883"></div>
      <div style="flex: 3; height: 6px; border-radius: 3px; background: #2A302C; overflow: hidden"><div style="width: 30%; height: 6px; background: #57D883; border-radius: 3px"></div></div>
      <div style="flex: 2; height: 6px; border-radius: 3px; background: #2A302C"></div>
      <div style="flex: 1; height: 6px; border-radius: 3px; background: #2A302C"></div>
    </div>
  </div>

  <p class="rise" style="margin: 30px 0 0; font: 600 12px Inter, sans-serif; letter-spacing: 1.6px; color: #57D883">YOUR GOAL</p>
  <h1 class="rise d1" style="margin: 10px 0 0; font: 600 32px/1.12 Onest, sans-serif; letter-spacing: -1px">Where do you want to land?</h1>

  <div class="rise d2" style="display: flex; align-items: baseline; justify-content: center; gap: 6px; margin-top: 20px">
    <label for="goalInput" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Goal weight in kg</label>
    <input id="goalInput" class="num" type="number" inputmode="decimal" step="0.1" value="{{text}}" onChange="{{type}}" onBlur="{{blur}}">
    <span style="width: 100px; font: 500 20px Onest, sans-serif; color: #A3ADA6">kg</span>
  </div>

  <div class="rise d2" style="position: relative; margin: 12px -24px 0">
    <div class="strip" ref="{{stripRef}}" onScroll="{{onScroll}}" style="padding: 0 192px" aria-hidden="true">
      <sc-for list="{{ticks}}" as="t" hint-placeholder-count="80">
        <div class="snap" style="width: 6px; height: 64px; display: flex; flex-direction: column; align-items: center">
          <div style="width: 2px; height: {{t.h}}px; border-radius: 1px; background: {{t.c}}"></div>
          <div style="margin-top: 6px; font: 500 12px Inter, sans-serif; color: #7C8680; white-space: nowrap; height: 16px">{{t.label}}</div>
        </div>
      </sc-for>
    </div>
    <div style="position: absolute; left: 193px; top: -6px; width: 4px; height: 48px; border-radius: 2px; background: #57D883; pointer-events: none"></div>
    <div style="position: absolute; left: 0; top: 0; width: 80px; height: 64px; background: linear-gradient(90deg,#0C0E0D,rgba(12,14,13,0)); pointer-events: none"></div>
    <div style="position: absolute; right: 0; top: 0; width: 80px; height: 64px; background: linear-gradient(270deg,#0C0E0D,rgba(12,14,13,0)); pointer-events: none"></div>
  </div>
  <p class="rise d2" style="margin: 6px 0 0; text-align: center; font-size: 15px; color: #A3ADA6">That’s <span style="color: #F4F6F4; font-weight: 600">{{diff}} kg</span> from where you are today.</p>

  <!-- Same projection card as the plan reveal (17): labels in a header row,
       nothing drawn over the chart. -->
  <div class="rise d3" style="margin-top: 18px; padding: 14px 16px 12px; border-radius: 24px; background: #151917">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
      <div><div style="font-size: 12px; color: #A3ADA6">Today</div><div style="margin-top: 2px; font: 600 15px Onest, sans-serif">82.4 kg</div></div>
      <div style="text-align: right"><div style="font-size: 12px; color: #A3ADA6">Goal · {{date}}</div><div style="margin-top: 2px; font: 600 15px Onest, sans-serif; color: #57D883">{{goal}} kg</div></div>
    </div>
    <svg width="310" height="72" viewBox="0 0 310 72" role="img" aria-label="Weight trending down from 82.4 kg to your goal" style="display: block; margin-top: 8px">
      <path d="M0 62 H310" stroke="#2A302C" stroke-dasharray="4 6"></path>
      <path class="proj" pathLength="1" d="M8 10 C 100 26, 190 54, 300 62" stroke="#57D883" stroke-width="3.5" fill="none" stroke-linecap="round"></path>
      <circle cx="8" cy="10" r="5" fill="#F4F6F4"></circle>
      <circle class="flag" cx="300" cy="62" r="6" fill="#57D883"></circle>
    </svg>
    <p style="margin: 10px 0 0; font-size: 13px; line-height: 1.5; color: #A3ADA6">About <span style="color: #F4F6F4; font-weight: 600">{{weeks}} weeks</span> at a steady pace. You’ll pick your pace next.</p>
  </div>

  <div style="flex-grow: 1"></div>
  <a href="Pace.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: #57D883; color: #06240F; font: 600 17px Onest, sans-serif; text-decoration: none">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Same ruler as the weight step: one tick is 0.1 kg and 6px wide. It
  // starts at today's weight and glides down to the suggested goal.
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const now = 82.4, MIN = 40, MAX = 82.3, PX = 6;
    const s = this.state || {};
    const goal = s.goal != null ? s.goal : 74;
    if (!this.ticks) {
      this.ticks = [];
      for (let i = 0; i <= Math.round((MAX - MIN) * 10); i++) {
        const major = i % 50 === 0, whole = i % 10 === 0;
        this.ticks.push({ h: major ? 36 : whole ? 22 : 12, c: major ? '#A3ADA6' : whole ? '#4A524C' : '#2E3530', label: major ? String(MIN + i / 10) : '' });
      }
    }
    const toPx = (v) => Math.round((v - MIN) * 10) * PX;
    const set = (v, scroll) => {
      const g = Math.round(Math.min(MAX, Math.max(MIN, v)) * 10) / 10;
      if (g !== goal) this.setState({ goal: g });
      if (scroll && this.el) this.el.scrollTo({ left: toPx(g), behavior: 'smooth' });
    };
    const perWeek = now * 0.005;
    const weeks = Math.max(1, Math.round((now - goal) / perWeek));
    const d = new Date(2026, 9, 24);
    d.setDate(d.getDate() + weeks * 7);
    return {
      ticks: this.ticks,
      goal: goal.toFixed(1),
      text: s.draft != null ? s.draft : goal.toFixed(1),
      type: (e) => {
        const raw = e.target.value.slice(0, 5);
        this.setState({ draft: raw });
        const v = parseFloat(raw);
        if (v >= MIN && v <= MAX) set(v, true);
      },
      blur: () => this.setState({ draft: null }),
      stripRef: (el) => {
        if (el && el !== this.el) {
          this.el = el;
          el.scrollLeft = toPx(MAX);
          this.t = setTimeout(() => el.scrollTo({ left: toPx(goal), behavior: 'smooth' }), 500);
        }
      },
      onScroll: (e) => { if (s.draft == null) set(MIN + Math.round(e.currentTarget.scrollLeft / PX) / 10, false); },
      diff: (now - goal).toFixed(1),
      weeks,
      date: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
    };
  }
}
</script>
</body>
</html>

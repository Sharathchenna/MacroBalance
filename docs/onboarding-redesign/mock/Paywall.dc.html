<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trial paywall</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0E0D}
a{color:#57D883}a:hover{color:#8BE8AA}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}
@keyframes fillv{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.rail{transform-origin:top;animation:fillv 1.4s .4s cubic-bezier(.4,0,.2,1) both}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(87,216,131,.5)}70%{box-shadow:0 0 0 12px rgba(87,216,131,0)}100%{box-shadow:0 0 0 0 rgba(87,216,131,0)}}
.now{animation:pulse 2s infinite}
.plan{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:14px 16px;border-radius:20px;cursor:pointer;text-align:left;font-family:Inter,sans-serif;color:#F4F6F4;transition:background .2s,border-color .2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 18px 24px 30px; display: flex; flex-direction: column; background: #0C0E0D; color: #F4F6F4; font-family: Inter, sans-serif; overflow: hidden">
  <div style="display: flex; justify-content: flex-end; height: 44px">
    <a href="#" style="display: flex; align-items: center; height: 44px; color: #A3ADA6; font: 500 14px Inter, sans-serif; text-decoration: none">Restore</a>
  </div>

  <h1 class="rise" style="margin: 4px 0 0; font: 600 32px/1.12 Onest, sans-serif; letter-spacing: -1px; white-space: pre-line">Start your plan
<span style="color: #57D883">free for 7 days.</span></h1>

  <div class="rise d1" style="position: relative; margin-top: 22px; padding-left: 44px; display: flex; flex-direction: column; gap: 18px">
    <div style="position: absolute; left: 15px; top: 16px; bottom: 16px; width: 4px; border-radius: 2px; background: #1D221F"></div>
    <div class="rail" style="position: absolute; left: 15px; top: 16px; height: 46%; width: 4px; border-radius: 2px; background: #57D883"></div>
    <div style="position: relative">
      <div class="now" style="position: absolute; left: -44px; top: 0; width: 34px; height: 34px; border-radius: 17px; background: #57D883; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#06240F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 7.6-1.7"></path></svg></div>
      <div style="font: 600 16px Onest, sans-serif">Today</div>
      <div style="margin-top: 3px; font-size: 14px; line-height: 1.45; color: #A3ADA6">Your plan, photo logging and weekly check-ins unlock.</div>
    </div>
    <div style="position: relative">
      <div style="position: absolute; left: -44px; top: 0; width: 34px; height: 34px; border-radius: 17px; background: #1D221F; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFD23F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></div>
      <div style="font: 600 16px Onest, sans-serif">Day 5</div>
      <div style="margin-top: 3px; font-size: 14px; line-height: 1.45; color: #A3ADA6">We remind you that your trial is ending.</div>
    </div>
    <div style="position: relative">
      <div style="position: absolute; left: -44px; top: 0; width: 34px; height: 34px; border-radius: 17px; background: #1D221F; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F4F6F4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path></svg></div>
      <div style="font: 600 16px Onest, sans-serif">Day 7</div>
      <div style="margin-top: 3px; font-size: 14px; line-height: 1.45; color: #A3ADA6">Your subscription starts. Cancel any time before then.</div>
    </div>
  </div>

  <div class="rise d2" style="display: flex; flex-direction: column; gap: 10px; margin-top: 26px">
    <button class="plan" onClick="{{pickYear}}" style="position: relative; background: {{y.bg}}; border: 2px solid {{y.border}}">
      <div style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 11px; border: 2px solid {{y.border}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><div style="width: 10px; height: 10px; border-radius: 5px; background: {{y.dot}}"></div></div>
      <div style="flex-grow: 1"><div style="font: 600 16px Onest, sans-serif">Yearly</div><div style="margin-top: 2px; font-size: 13px; color: #A3ADA6">7 days free, then [YEARLY PRICE]/yr</div></div>
      <div style="text-align: right"><div style="font: 600 15px Onest, sans-serif">[PER MONTH]</div><div style="font-size: 12px; color: #A3ADA6">/month</div></div>
      <span style="position: absolute; top: -11px; right: 16px; padding: 3px 10px; border-radius: 10px; background: #FFD23F; color: #2A1E00; font: 700 11px Inter, sans-serif; letter-spacing: .3px">BEST VALUE</span>
    </button>
    <button class="plan" onClick="{{pickMonth}}" style="background: {{m.bg}}; border: 2px solid {{m.border}}">
      <div style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 11px; border: 2px solid {{m.border}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><div style="width: 10px; height: 10px; border-radius: 5px; background: {{m.dot}}"></div></div>
      <div style="flex-grow: 1"><div style="font: 600 16px Onest, sans-serif">Monthly</div><div style="margin-top: 2px; font-size: 13px; color: #A3ADA6">Billed every month</div></div>
      <div style="text-align: right"><div style="font: 600 15px Onest, sans-serif">[MONTHLY PRICE]</div><div style="font-size: 12px; color: #A3ADA6">/month</div></div>
    </button>
  </div>

  <div style="flex-grow: 1"></div>
  <a class="rise d3" href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: #57D883; color: #06240F; font: 600 17px Onest, sans-serif; text-decoration: none">{{cta}}</a>
  <p class="rise d4" style="margin: 10px 0 0; text-align: center; font-size: 13px; color: {{noteColor}}">{{note}}</p>
  <p style="margin: 6px 0 0; text-align: center; font-size: 12px; color: #7C8680"><a href="#" style="color: #7C8680">Terms</a> · <a href="#" style="color: #7C8680">Privacy</a></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const monthly = !!(this.state && this.state.monthly);
    const on = { bg: 'rgba(87,216,131,.08)', border: '#57D883', dot: '#57D883' };
    const off = { bg: '#151917', border: '#2A302C', dot: 'transparent' };
    return {
      y: monthly ? off : on,
      m: monthly ? on : off,
      cta: monthly ? 'Subscribe monthly' : 'Start my free week',
      note: monthly ? 'Cancel any time in Settings.' : 'No payment due today',
      noteColor: monthly ? '#7C8680' : '#57D883',
      pickYear: () => this.setState({ monthly: false }),
      pickMonth: () => this.setState({ monthly: true }),
    };
  }
}
</script>
</body>
</html>

<style>
body{margin:0;background:#0C0E0D}
a{color:#57D883}a:hover{color:#8BE8AA}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}
@keyframes fillbar{from{width:0}to{width:100%}}
.bar{animation:fillbar 6s linear both}
@keyframes drawline{0%{stroke-dashoffset:1}55%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.real{stroke-dasharray:1 1;animation:drawline 6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes pop1{0%,20%{opacity:0;transform:scale(0)}25%,92%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes pop2{0%,33%{opacity:0;transform:scale(0)}38%,92%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes pop3{0%,46%{opacity:0;transform:scale(0)}51%,92%{opacity:1;transform:scale(1)}100%{opacity:0}}
.pt{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop1 6s cubic-bezier(.2,.9,.3,1.4) infinite}
.p2{animation-name:pop2}.p3{animation-name:pop3}
@keyframes toast{0%,52%{opacity:0;transform:translateY(16px)}60%,92%{opacity:1;transform:none}100%{opacity:0}}
.toast{animation:toast 6s cubic-bezier(.2,.8,.2,1) infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.pt,.toast{opacity:1}.real{stroke-dashoffset:0}}
</style>
